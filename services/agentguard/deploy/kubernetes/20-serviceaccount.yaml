# Dedicated ServiceAccount for the identity service.
# automountServiceAccountToken=false: the workload never talks to the Kubernetes API, so it must not
# carry a token that could be used to pivot if the process were compromised.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentguard-identity
  namespace: agentguard
  labels: {app.kubernetes.io/name: agentguard, app.kubernetes.io/component: identity}
automountServiceAccountToken: false
---
# Migration Job runs as its own identity with the same least-privilege posture.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentguard-migrate
  namespace: agentguard
  labels: {app.kubernetes.io/name: agentguard, app.kubernetes.io/component: migrate}
automountServiceAccountToken: false
