# Kustomize entry point. Apply the whole topology with:
#   kubectl apply -k deploy/kubernetes
#
# Ordering note: Kubernetes applies resources in a dependency-aware order, but the migration Job
# (40-migrate-job.yaml) must complete BEFORE the Deployment rolls out. The documented procedure is:
#   1. kubectl apply -k deploy/kubernetes   (creates namespace, config, PG, Redis, migrate Job)
#   2. kubectl -n agentguard wait --for=condition=complete job/agentguard-migrate --timeout=300s
#   3. kubectl -n agentguard rollout status deploy/agentguard-identity
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentguard
resources:
  - 00-namespace.yaml
  - 10-configmap.yaml
  - 11-secrets.example.yaml
  - 20-serviceaccount.yaml
  - 30-postgres-statefulset.yaml
  - 31-redis-statefulset.yaml
  - 40-migrate-job.yaml
  - identity-service.yaml
  - 60-networkpolicy.yaml
  - 70-ingress.yaml
  - 80-pdb-hpa.yaml
commonLabels:
  app.kubernetes.io/part-of: agentguard
