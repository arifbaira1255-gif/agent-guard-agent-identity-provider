# EXAMPLE ONLY -- do not commit real values.
# In production, provision these with an external secret manager (External Secrets Operator, Vault
# CSI, Sealed Secrets, or a cloud secret manager CSI driver) so plaintext never lands in Git.
#
#   kubectl -n agentguard create secret generic agentguard-identity-secrets \
#     --from-literal=AGENT_IDENTITY_MASTER_KEY="$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')" \
#     --from-literal=AGENTGUARD_SESSION_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=AGENTGUARD_PG_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=AGENTGUARD_REDIS_PASSWORD="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: agentguard-identity-secrets
  namespace: agentguard
  labels: {app.kubernetes.io/name: agentguard}
type: Opaque
stringData:
  AGENT_IDENTITY_MASTER_KEY: "REPLACE_WITH_FERNET_KEY"
  AGENTGUARD_SESSION_SECRET: "REPLACE_WITH_48_BYTE_RANDOM"
  AGENTGUARD_PG_PASSWORD: "REPLACE"
  AGENTGUARD_REDIS_PASSWORD: "REPLACE"
---
# TLS material for the ingress / service (replace with cert-manager or your PKI).
apiVersion: v1
kind: Secret
metadata:
  name: agentguard-tls
  namespace: agentguard
type: kubernetes.io/tls
stringData:
  tls.crt: "REPLACE"
  tls.key: "REPLACE"
---
# CA bundles for PostgreSQL and Redis TLS verification (verify-full).
apiVersion: v1
kind: Secret
metadata:
  name: agentguard-pg-ca
  namespace: agentguard
type: Opaque
stringData:
  ca.pem: "REPLACE_WITH_PG_CA"
---
apiVersion: v1
kind: Secret
metadata:
  name: agentguard-redis-ca
  namespace: agentguard
type: Opaque
stringData:
  ca.pem: "REPLACE_WITH_REDIS_CA"
