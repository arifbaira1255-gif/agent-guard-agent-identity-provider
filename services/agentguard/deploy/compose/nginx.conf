# TLS-terminating reverse proxy for the self-hosted topology.
# Re-encrypts to the app, caps body size and timeouts, and adds HSTS.
worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    client_max_body_size 1m;

    server {
        listen 443 ssl;
        http2 on;
        server_name agentguard.example.net;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass https://identity:8443;
            proxy_ssl_verify off;              # app cert is internal; verify at the edge
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
