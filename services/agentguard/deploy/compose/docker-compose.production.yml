# AgentGuard -- self-hosted production topology (Docker Compose).
#
# A single-host reference deployment for private-cloud / on-prem. It is NOT a substitute for a
# managed HA database or an orchestrator; it is the smallest topology that runs the real stack with
# TLS, a non-root app container, migrations as a separate step, and health-gated startup.
#
#   docker compose -f deploy/compose/docker-compose.production.yml up -d
#
# Secrets come from a .env file (never committed) or your secret manager's env injection.
# See docs/PHASE9_PRIVATE_CLOUD.md for prerequisites, TLS, KMS and upgrade/rollback.
name: agentguard

services:
  postgres:
    image: postgres:15.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENTGUARD_PG_DB:-agentguard}
      POSTGRES_USER: ${AGENTGUARD_PG_USER:-agentguard}
      POSTGRES_PASSWORD: ${AGENTGUARD_PG_PASSWORD:?set AGENTGUARD_PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENTGUARD_PG_USER:-agentguard}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7.2.4-bookworm
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${AGENTGUARD_REDIS_PASSWORD:?set AGENTGUARD_REDIS_PASSWORD}",
              "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$AGENTGUARD_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      AGENTGUARD_REDIS_PASSWORD: ${AGENTGUARD_REDIS_PASSWORD}
    networks: [backend]

  migrate:
    image: agentguard/agent-identity:${AGENTGUARD_VERSION:-0.1.0}
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AGENTGUARD_ENV: production
      AGENTGUARD_PG_HOST: postgres
      AGENTGUARD_PG_PORT: "5432"
      AGENTGUARD_PG_DB: ${AGENTGUARD_PG_DB:-agentguard}
      AGENTGUARD_PG_USER: ${AGENTGUARD_PG_USER:-agentguard}
      AGENTGUARD_PG_PASSWORD: ${AGENTGUARD_PG_PASSWORD}
      AGENTGUARD_PG_SSLMODE: ${AGENTGUARD_PG_SSLMODE:-prefer}
      AGENT_IDENTITY_MASTER_KEY: ${AGENT_IDENTITY_MASTER_KEY:?set AGENT_IDENTITY_MASTER_KEY}
    networks: [backend]
    restart: "no"

  identity:
    image: agentguard/agent-identity:${AGENTGUARD_VERSION:-0.1.0}
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment:
      AGENTGUARD_ENV: production
      AGENTGUARD_LISTEN_HOST: 0.0.0.0
      AGENTGUARD_LISTEN_PORT: "8443"
      AGENTGUARD_SESSION_SECRET: ${AGENTGUARD_SESSION_SECRET:?set AGENTGUARD_SESSION_SECRET}
      AGENT_IDENTITY_MASTER_KEY: ${AGENT_IDENTITY_MASTER_KEY}
      AGENTGUARD_PG_HOST: postgres
      AGENTGUARD_PG_PORT: "5432"
      AGENTGUARD_PG_DB: ${AGENTGUARD_PG_DB:-agentguard}
      AGENTGUARD_PG_USER: ${AGENTGUARD_PG_USER:-agentguard}
      AGENTGUARD_PG_PASSWORD: ${AGENTGUARD_PG_PASSWORD}
      AGENTGUARD_PG_SSLMODE: ${AGENTGUARD_PG_SSLMODE:-prefer}
      AGENTGUARD_REDIS_HOST: redis
      AGENTGUARD_REDIS_PORT: "6379"
      AGENTGUARD_REDIS_PASSWORD: ${AGENTGUARD_REDIS_PASSWORD}
      AGENTGUARD_REDIS_TLS: "0"          # in-network; terminate TLS at the proxy
      AGENTGUARD_KMS_PROVIDER: ${AGENTGUARD_KMS_PROVIDER:-aws-kms}
      AGENTGUARD_KMS_REGION: ${AGENTGUARD_KMS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:8443:8443"            # only the TLS proxy may reach the app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8443/livez"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [backend]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      identity: {condition: service_healthy}
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks: [backend]

volumes:
  pgdata:
  redisdata:

networks:
  backend:
    driver: bridge
