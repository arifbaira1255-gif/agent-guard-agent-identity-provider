[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "happy-lang"
version = "1.0.0"
description = "The Happy (.hpy) programming language: compiler, runtime, security model, AI-native layer and developer tooling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Happy Language Contributors" }]
keywords = ["programming-language", "compiler", "happy", "hpy", "contracts", "capabilities", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
# The Happy toolchain is implemented entirely on the Python standard library:
# no third-party runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://example.invalid/happy-lang"
Documentation = "https://example.invalid/happy-lang/docs"
Source = "https://example.invalid/happy-lang"

[project.scripts]
happy = "happy.cli.main:main"

[tool.setuptools]
packages = [
    "happy",
    "happy.compiler",
    "happy.backend",
    "happy.runtime",
    "happy.std",
    "happy.ai",
    "happy.security",
    "happy.cli",
    "happy.package",
    "happy.tools",
]

[tool.setuptools.package-data]
happy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
